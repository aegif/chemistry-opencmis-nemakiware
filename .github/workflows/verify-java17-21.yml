name: Verify Java 17 and 21 Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main
      - "codex/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: ["17", "21"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Build NemakiWare-required modules
        run: |
          MODULES="chemistry-opencmis-commons/chemistry-opencmis-commons-api,\
chemistry-opencmis-commons/chemistry-opencmis-commons-impl,\
chemistry-opencmis-client/chemistry-opencmis-client-api,\
chemistry-opencmis-client/chemistry-opencmis-client-bindings,\
chemistry-opencmis-client/chemistry-opencmis-client-impl,\
chemistry-opencmis-server/chemistry-opencmis-server-support,\
chemistry-opencmis-server/chemistry-opencmis-server-bindings,\
chemistry-opencmis-test/chemistry-opencmis-test-tck"
          mvn -DskipTests -pl "${MODULES}" -am package

      - name: Run client-bindings unit tests
        run: |
          mvn -f chemistry-opencmis-client/chemistry-opencmis-client-bindings/pom.xml \
            test \
            -Dopencmis.integration.tests.skip=true
